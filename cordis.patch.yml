# The dsh-ask bundle patch: a lightweight one-shot "ask" mode directly over
# dsh-base. It mounts no Host, HTTP server, Web runtime, or browser plugin.
# Like the headless bundle, the runner creates an Agent through the core
# registry and prints its durable result — but the session identity is a
# deterministic hash of (cwd, terminal session), so consecutive asks in the
# same terminal and directory resume the same conversation ("临时会话"),
# while a restarted terminal or a different directory starts fresh.

- id: system-prompt
  config:
    persona: >-
      You are a coding agent powered by the {{model}} model. Your working directory is {{cwd}}.

# The shared module-reload HMR row stays off; the launcher's watch-only
# fallback still keeps the user patch layers live until the run exits.
- id: hmr
  disabled: true

- id: tools
  config:
    # Keep the same temporary process-wide Code Mode opt-in as the Web surface.
    mode: !!js process.env.DSH_TOOLS_MODE

- insert:
    - id: ask-startup
      name: '@dsh-local/dsh-ask/startup'

    # Reads its task (and the fresh/session flags) from the askStartup service.
    - id: ask-runner
      name: '@dsh-local/dsh-ask'
      inject: [askStartup]
      config:
        task: !!js ctx.askStartup.task
        fresh: !!js ctx.askStartup.fresh
        explicitSession: !!js ctx.askStartup.session
